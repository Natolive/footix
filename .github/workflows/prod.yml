# Push sur main : tests, image publiée sur ghcr.io, puis déploiement sur le serveur de prod.
# Secrets à créer dans l'environnement GitHub « production » : voir README, section Production.
name: Prod

on:
  push:
    branches: [main]

# Un seul déploiement à la fois ; un push plus récent annule celui en attente.
concurrency:
  group: prod
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/natolive/footix

jobs:
  test:
    runs-on: ubuntu-latest
    # Même image que le Dockerfile.
    container: node:alpine
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: footix
          POSTGRES_PASSWORD: footix
          POSTGRES_DB: footix
        options: --health-cmd "pg_isready -U footix" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://footix:footix@postgres:5432/footix
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run db:migrate -w backend
      # Tests unitaires avec couverture : leurs chiffres alimentent les badges du README.
      - run: npm run test:cov -w backend -- --reporter=default --reporter=json --outputFile.json=coverage/tests.json
      - run: npm run test:e2e -w backend
      - name: Données des badges (format endpoint de shields.io)
        run: |
          mkdir -p badges
          node -e '
            const fs = require("fs");
            const pct = require("./backend/coverage/coverage-summary.json").total.lines.pct;
            const { numPassedTests } = require("./backend/coverage/tests.json");
            const badge = (name, label, message, color) =>
              fs.writeFileSync(`badges/${name}.json`, JSON.stringify({ schemaVersion: 1, label, message, color }));
            badge("coverage", "coverage", `${pct}%`, pct >= 90 ? "brightgreen" : pct >= 75 ? "green" : pct >= 60 ? "yellow" : "orange");
            badge("tests", "tests", `${numPassedTests} passed`, "brightgreen");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: badges
          path: badges

  # Branche `badges` réécrite à chaque push (un seul commit) : shields.io lit ses JSON, sans service externe.
  badges:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: badges
          path: badges
      - name: Publier sur la branche badges
        working-directory: badges
        run: |
          git init -q -b badges
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Badges de ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" badges

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag du commit pour revenir en arrière, `latest` pour le serveur.
      - uses: docker/build-push-action@v6
        with:
          target: prod
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false
      - name: Déployer sur le serveur
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp docker-compose.prod.yml "$SSH_TARGET":footix/
          # Nettoyage : chaque déploiement laisse l'image taguée du commit précédent, que `prune` seul ne retire pas.
          # `rmi` supprime les anciennes versions de footix (Docker garde celle utilisée) ; `prune` les postgres sans tag.
          # Jeton du job, clé et expéditeur Brevo passés sur l'entrée standard : jamais en ligne de commande ni dans les logs.
          # Le serveur n'a aucun identifiant GitHub à garder ; BREVO_API_KEY (secret) et MAIL_FROM (variable) de
          # l'environnement GitHub font référence et sont recopiés dans son .env.
          printf '%s\n%s\n%s\n' "$GHCR_TOKEN" "$BREVO_API_KEY" "$MAIL_FROM" | ssh "$SSH_TARGET" "read -r GHCR_TOKEN \
            && read -r BREVO_API_KEY && read -r MAIL_FROM \
            && test -n \"\$BREVO_API_KEY\" && test -n \"\$MAIL_FROM\" \
            && cd ~/footix \
            && (umask 077; grep -Ev '^(BREVO_API_KEY|MAIL_FROM)=' .env > .env.new; \
              printf 'BREVO_API_KEY=%s\nMAIL_FROM=%s\n' \"\$BREVO_API_KEY\" \"\$MAIL_FROM\" >> .env.new) \
            && mv .env.new .env \
            && echo \"\$GHCR_TOKEN\" | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && export IMAGE_TAG=${{ github.sha }} \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d \
            && (docker rmi \$(docker images -q ghcr.io/natolive/footix) 2>/dev/null; docker image prune -f); docker logout ghcr.io"
